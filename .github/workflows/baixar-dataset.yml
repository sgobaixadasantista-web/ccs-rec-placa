name: Baixar dataset publico e treinar YOLO

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Numero de epocas'
        required: false
        default: '10'
      imgsz:
        description: 'Resolucao de treino'
        required: false
        default: '640'
      batch:
        description: 'Batch size'
        required: false
        default: '16'
      max_por_split:
        description: '0=todas as imagens; use 1000 para teste rapido'
        required: false
        default: '1000'

jobs:
  treinar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de treino
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics datasets pillow

      - name: Baixar e preparar dataset publico do Hugging Face
        run: |
          python baixar_dataset_publico.py \
            --max-por-split ${{ inputs.max_por_split }}

      - name: Validar dataset
        run: |
          python - <<'PY'
          from pathlib import Path

          for split in ['train', 'val', 'test']:
              imgs = Path('dataset/images') / split
              lbls = Path('dataset/labels') / split
              n_img = len([p for p in imgs.glob('*') if p.is_file()]) if imgs.exists() else 0
              n_lbl = len(list(lbls.glob('*.txt'))) if lbls.exists() else 0
              print(f'{split}: {n_img} imagens / {n_lbl} labels')
              if split in ('train', 'val') and (n_img == 0 or n_lbl == 0):
                  raise SystemExit(f'Split obrigatorio vazio: {split}')
          PY

      - name: Treinar YOLO11n
        run: |
          python treinar_yolo.py \
            --data dataset.yaml \
            --modelo yolo11n.pt \
            --epochs ${{ inputs.epochs }} \
            --imgsz ${{ inputs.imgsz }} \
            --batch ${{ inputs.batch }} \
            --device cpu \
            --project runs \
            --name placas

      - name: Validar best.pt no conjunto de teste
        run: |
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO

          best = Path('runs/placas/weights/best.pt')
          test_dir = Path('dataset/images/test')
          if not best.exists():
              raise SystemExit('best.pt nao foi gerado')
          if not test_dir.exists() or not any(test_dir.iterdir()):
              print('Split test vazio; validacao final ignorada.')
              raise SystemExit(0)

          model = YOLO(str(best))
          metrics = model.val(data='dataset.yaml', split='test', imgsz=640, device='cpu', plots=True)
          print(metrics)
          PY

      - name: Publicar modelo treinado
        uses: actions/upload-artifact@v4
        with:
          name: ccs-rec-placa-best-pt
          path: runs/placas/weights/best.pt
          retention-days: 30

      - name: Publicar relatorios de treino
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-treinamento
          path: |
            runs/placas/results.csv
            runs/placas/results.png
            runs/placas/confusion_matrix*.png
            runs/placas/PR_curve.png
            runs/placas/F1_curve.png
            runs/placas/P_curve.png
            runs/placas/R_curve.png
          if-no-files-found: ignore
          retention-days: 30
